<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM adapter demo</title>
    <style>
      body { font: 15px system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
      button { font: inherit; padding: 6px 12px; margin: 0 6px 6px 0; }
      pre { background: #f3f4f6; padding: 10px; border-radius: 6px; min-height: 5em; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>DOM adapter demo</h1>
    <p>Click around (do a couple of normal checkouts before the failing one so there is a baseline to compare against), then export the recording and open it in the viewer (<code>npm run dev -w @eda-debugger/viewer</code>).</p>
    <div>
      <button id="add">Add to cart</button>
      <button id="checkout">Checkout</button>
      <button id="fail">Checkout (payment fails)</button>
      <button id="export">Export recording</button>
    </div>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
